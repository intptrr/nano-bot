name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Sync Env File to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          envs: ENV_FILE
          script: |
            set -e
            mkdir -p ~/apps/nano-bot
            umask 077
            printf '%s' "$ENV_FILE" > ~/apps/nano-bot/.env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Deploy Container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/apps/nano-bot
            for attempt in 1 2 3; do
              if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin && docker pull "${IMAGE}:latest"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Unable to authenticate to GHCR and pull image after 3 attempts." >&2
                exit 1
              fi

              echo "GHCR auth/pull failed (attempt ${attempt}), retrying in 10s..." >&2
              sleep 10
            done
            docker rm -f nano-bot 2>/dev/null || true
            docker run -d \
              --name nano-bot \
              --restart unless-stopped \
              --env-file .env \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "${IMAGE}:latest"
            docker image prune -f
            docker logout ghcr.io
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
