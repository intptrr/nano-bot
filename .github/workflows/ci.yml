name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nano-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Image
        run: docker run --rm nano-bot:ci python -c "import nano_bot.app"
