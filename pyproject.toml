[project]
name = "nano-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.1",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
    "yfinance>=1.5.2",
]

[project.scripts]
nano-bot = "nano_bot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_bot"]
